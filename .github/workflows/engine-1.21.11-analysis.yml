name: Horizon 1.21.11 engine port analysis

on:
  push:
    branches: [engine-1.21.11]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-engine-port-1-21-11
  cancel-in-progress: true

jobs:
  analyze:
    name: Compare official 1.21.11 against the 26.3 engine baseline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HORIZON_VERSIONS: ${{ runner.temp }}/horizon-versions
    steps:
      - name: Check out engine port branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 21 for Minecraft 1.21.11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare official unobfuscated 1.21.11
        run: python tools/prepare_unobfuscated_1_21_11.py --jobs 2

      - name: Set up Java 25 for Minecraft 26.3
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Prepare the pinned 26.3 comparison baseline
        run: python tools/version_port.py prepare 26.3 --download --jobs 2

      - name: Generate compatibility diff and ranked report
        run: |
          python tools/version_port.py diff 26.3 1.21.11
          python tools/version_port.py report 26.3 1.21.11 --lines 120

      - name: Upload metadata-only analysis
        uses: actions/upload-artifact@v4
        with:
          name: horizon-engine-1.21.11-analysis
          path: |
            ${{ runner.temp }}/horizon-versions/diff-26.3-1.21.11/report.md
            ${{ runner.temp }}/horizon-versions/diff-26.3-1.21.11/report.json
            ${{ runner.temp }}/horizon-versions/diff-26.3-1.21.11/diff.json
            ${{ runner.temp }}/horizon-versions/diff-26.3-1.21.11/vanilla_map.json
          if-no-files-found: error
          retention-days: 14
